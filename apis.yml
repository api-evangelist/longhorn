aid: longhorn
name: Longhorn
description: >-
  Longhorn is a CNCF incubating lightweight, reliable, and easy-to-use distributed block storage system for Kubernetes.
  It creates a dedicated storage controller for each volume and replicates data across multiple nodes for high
  availability. Longhorn supports snapshots, backups to S3-compatible storage, disaster recovery, and recurring backup
  schedules.
url: https://longhorn.io
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: false
  try_now: true
  public: false
  label: Freemium · Self-serve signup
  confidence: high
  source:
