naftiko: 1.0.0-alpha2
info:
  label: Longhorn Manager API
  description: The Longhorn Manager REST API provides programmatic access to all Longhorn storage management operations. The
    API follows the Rancher REST API specification and is served by the Longhorn Manager service, typically accessible within
    a Kubernetes cluster at port 9500 or via the longhorn-backend service. It provides full lifecycle management for volumes,
    snapshots, backups, nodes, disks, engine images, recurring jobs, and system settings. The API is used by the Longhorn
    UI and can be accessed directly for automation and integration. The schema is discoverable at /v1/schemas.
  tags:
  - Longhorn
  - API
  created: '2026-05-06'
  modified: '2026-05-06'
